name: daily-pipeline

# Always-on replacement for the local Mac cron: generates picks daily even when
# the laptop is off. Runs the same scripts/daily.sh against the Railway DB.
#
# Scheduling: ONE daily UTC cron (no DST dual-cron). GitHub bills every triggered
# run — including a dual-cron's gated-out twin — rounded up to a full minute, so
# the old PDT+PST pair burned ~30 wasted min/month here. A single cron at 14:00
# UTC fires once/day: 7 AM in summer (PDT), 6 AM in winter (PST). An hour's
# seasonal drift on a morning batch is immaterial. Manual dispatch still works.
on:
  schedule:
    - cron: "0 14 * * *"   # 7 AM PDT / 6 AM PST
  workflow_dispatch: {}

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # The full pipeline normally runs 30-90 min, but on DB-slow days every
    # step runs 4-7x slower (2026-11-18: model loads that take 1-2 min took
    # 7; one pick-persist stalled 12). Two runs (11-09, 11-18) hit the old
    # 90-min ceiling and were cancelled mid-predict — silently, because
    # daily.sh's own alerting dies with the job. 150 covers a slow day; the
    # alert job below pings when even that isn't enough.
    timeout-minutes: 150
    env:
      RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PRIZEPICKS_PROXY: ${{ secrets.PRIZEPICKS_PROXY }}
      # Dead-man's-switch: daily.sh pings this only on a clean run. Unset => no
      # ping step (harmless). Set the HEALTHCHECK_PING_URL secret to activate.
      HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
      # Lines paused (scrape source blocked): set repo variable LINES_PAUSED=1 to
      # skip the scrape gracefully + suppress the expected empty-slate alerts.
      LINES_PAUSED: ${{ vars.LINES_PAUSED || '0' }}
      # Active line source (book): 'sleeper' (open API) or 'prizepicks'. One switch
      # for ingest + predict — see props/ingest/line_feed.py.
      LINE_FEED: ${{ vars.LINE_FEED || 'prizepicks' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: System deps (libgomp for LightGBM)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        run: bash scripts/daily.sh

  alert:
    # A job killed by timeout-minutes can't send its own alert — two daily
    # runs (2026-11-09, 2026-11-18) were cancelled at the ceiling and nothing
    # pinged, the same silent-failure shape as the red-main CI gap. This job
    # outlives the kill and pings Discord whenever daily didn't succeed.
    needs: [daily]
    if: always() && needs.daily.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discord daily-pipeline alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT: ${{ needs.daily.result }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && { echo "no webhook configured"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK_URL" -d '{
            "embeds": [{
              "title": "🔴 daily-pipeline: '"$RESULT"'",
              "description": "The daily run did not finish — timeout kills land here too. ['"$RUN_URL"']('"$RUN_URL"')",
              "color": 15158332,
              "footer": {"text": "daily.yml · alert job"}
            }]
          }'
